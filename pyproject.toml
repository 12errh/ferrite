[project]
name = "ferrite"
version = "0.1.0.dev0"
description = "A Python-to-Rust transpiler with a correctness guarantee."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
# F6 — the LLM repair loop. Off by default; see ADR-0007.
repair = ["anthropic>=0.34"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pyright>=1.1",
    "maturin>=1.5",
    "ruff>=0.6",
    "mypy>=1.11",
]

# T-006 adds the console script, when ferrite/cli.py exists:
# [project.scripts]
# ferrite = "ferrite.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout, not uv's default src/ layout (TRD §9).
packages = ["ferrite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "milestone: exclude a fixture until its milestone begins (TESTING.md §2)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["ferrite"]
